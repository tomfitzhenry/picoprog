[package]
name = "serprog"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
embassy-usb.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
#log.workspace = true
heapless.workspace = true
defmt.workspace = true
num_enum.workspace = true
tock-registers.workspace = true
zerocopy.workspace = true

[dev-dependencies]
# End-to-end test client: rflasher drives a real serprog session against this
# crate over loopback TCP, with a flash-chip emulator on the SPI side.
rflasher-core = { git = "https://github.com/ArthurHeymans/rflasher", rev = "a92392b30c1b4928369cf7358c826d5dbbcf6b83" }
rflasher-programmers = { git = "https://github.com/ArthurHeymans/rflasher", rev = "a92392b30c1b4928369cf7358c826d5dbbcf6b83", features = ["serprog"] }
